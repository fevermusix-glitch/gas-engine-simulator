<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="pistonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#090d16"/>
  <!-- Spark explosion glow -->
  <circle cx="256" cy="130" r="70" fill="url(#metal)" opacity="0.3" filter="blur(20px)"/>
  <!-- Cylinder outline -->
  <rect x="146" y="70" width="220" height="260" rx="12" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="12 8"/>
  <!-- Spark plug -->
  <rect x="246" y="40" width="20" height="50" fill="#f8fafc" rx="4"/>
  <polygon points="256,92 248,110 264,110" fill="#fbbf24"/>
  <!-- Piston -->
  <rect x="160" y="140" width="192" height="100" rx="10" fill="url(#pistonGrad)"/>
  <line x1="165" y1="165" x2="347" y2="165" stroke="#1e293b" stroke-width="4"/>
  <line x1="165" y1="185" x2="347" y2="185" stroke="#1e293b" stroke-width="4"/>
  <circle cx="256" cy="200" r="16" fill="#1e293b"/>
  <!-- Connecting rod -->
  <path d="M246,200 L242,340 L270,340 L266,200 Z" fill="#64748b"/>
  <!-- Crankshaft journal -->
  <circle cx="256" cy="350" r="32" fill="#334155" stroke="#0ea5e9" stroke-width="6"/>
  <circle cx="256" cy="350" r="12" fill="#0ea5e9"/>
  <!-- V-engine angle indicator lines -->
  <line x1="256" y1="350" x2="160" y2="230" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="350" x2="352" y2="230" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
